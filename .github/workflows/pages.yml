name: Deploy data explorer to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-preview.mjs
      - run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html app.js rate-analysis.html rate-analysis.js rate-math.js styles.css LICENSE-CODE LICENSE-DATA _site/
          cp -r data _site/data
          cp -r assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
